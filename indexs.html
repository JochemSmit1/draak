<!DOCTYPE html>
<html><head><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>SMAUG PIXEL CHASE</title>
<style>body{margin:0;overflow:hidden;background:#000;touch-action:none;font-family:monospace;image-rendering:pixelated}#ui{position:absolute;top:8px;left:8px;background:rgba(0,0,60,.85);border:2px solid #aaf;padding:6px 10px;color:#ffdd77;font-weight:bold;font-size:12px;z-index:2;line-height:1.3}#joy{position:absolute;left:15px;bottom:15px;width:110px;height:110px;background:rgba(255,255,255,.12);border-radius:50%;z-index:3;border:2px solid rgba(255,255,255,.3)}#stick{position:absolute;left:25px;top:25px;width:60px;height:60px;background:rgba(255,255,255,.5);border-radius:50%}#fire{position:absolute;right:15px;bottom:15px;width:90px;height:90px;background:radial-gradient(#ff7700,#aa2200);border-radius:50%;border:3px solid #ffaa00;color:#fff;font-weight:bold;z-index:3}#menu{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#0a1430;z-index:10;color:#fff;gap:12px;text-align:center}</style>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js"}}</script>
</head><body>
<div id="menu"><h1 style="color:#ffcc33;margin:0;font-size:28px">PIXEL CHASE</h1><p style="margin:0;color:#aaf">ZOALS JE FOTO, MAAR ACHTER SMAUG</p><p style="font-size:11px;opacity:0.6">Zelfde dorp, rivier, bruggen - nu 3D chase cam</p><button onclick="start()" style="padding:16px 30px;font-size:18px;background:#ffcc33;border:none;border-radius:8px;font-weight:bold">🐉 START</button></div>
<div id="ui" style="display:none">BUILDINGS BURNED: <span id="s">0</span><br>SCORE: <span id="sc">0</span></div>
<div id="joy" style="display:none"><div id="stick"></div></div>
<button id="fire" style="display:none">🔥<br>FIRE</button>
<script type="module">
import * as THREE from 'three';
let scene,camera,renderer,dragon,leftWing,rightWing,houses=[],fires=[],score=0,scorePts=0,joy={x:0,y:0},isFiring=false,camTarget=new THREE.Vector3();
window.start=()=>{document.getElementById('menu').style.display='none';document.getElementById('ui').style.display='block';document.getElementById('joy').style.display='block';document.getElementById('fire').style.display='block';init();}

function pixelCabin(x,z){
 let g=new THREE.Group();
 // pixel block style huis zoals foto
 let base=new THREE.Mesh(new THREE.BoxGeometry(3.2,1.8,2.8),new THREE.MeshStandardMaterial({color:0x6b4a2f}));base.position.y=0.9;g.add(base);
 let roof=new THREE.Mesh(new THREE.BoxGeometry(3.6,0.6,3.2),new THREE.MeshStandardMaterial({color:0x4a3725}));roof.position.y=2.1;g.add(roof);
 let snowR=new THREE.Mesh(new THREE.BoxGeometry(3.7,0.2,3.3),new THREE.MeshStandardMaterial({color:0xddeeff}));snowR.position.y=2.45;g.add(snowR);
 // ramen oranje zoals foto
 let win=new THREE.Mesh(new THREE.PlaneGeometry(0.4,0.4),new THREE.MeshStandardMaterial({color:0xff6600,emissive:0xff4400,emissiveIntensity:0.8}));win.position.set(1.61,1,0.3);win.rotation.y=1.57;g.add(win);
 g.position.set(x,0,z);g.userData={burning:false,smoke:[]};scene.add(g);houses.push(g);
}

function init(){
 scene=new THREE.Scene();scene.background=new THREE.Color(0x16213e);scene.fog=new THREE.Fog(0x16213e,30,70);
 camera=new THREE.PerspectiveCamera(60,innerWidth/innerHeight,0.1,1000);
 renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);document.body.appendChild(renderer.domElement);
 scene.add(new THREE.AmbientLight(0xffffff,1));
 let sun=new THREE.DirectionalLight(0xffffff,1);sun.position.set(10,20,10);scene.add(sun);

 // GROND - zoals foto blauw sneeuw + rivier in midden
 let groundL=new THREE.Mesh(new THREE.PlaneGeometry(70,120),new THREE.MeshStandardMaterial({color:0xc8d8f0}));groundL.rotation.x=-1.57;groundL.position.set(-35,0,0);scene.add(groundL);
 let groundR=new THREE.Mesh(new THREE.PlaneGeometry(70,120),new THREE.MeshStandardMaterial({color:0xc8d8f0}));groundR.rotation.x=-1.57;groundR.position.set(35,0,0);scene.add(groundR);
 let river=new THREE.Mesh(new THREE.PlaneGeometry(18,120),new THREE.MeshStandardMaterial({color:0x2a5a9a}));river.rotation.x=-1.57;river.position.y=0.03;scene.add(river);
 let ice=new THREE.Mesh(new THREE.PlaneGeometry(12,120),new THREE.MeshStandardMaterial({color:0x7bb0e0,transparent:true,opacity:0.6}));ice.rotation.x=-1.57;ice.position.y=0.04;scene.add(ice);

 // bruggen zoals op foto - 2 stuks
 let b1=new THREE.Mesh(new THREE.BoxGeometry(12,0.4,3),new THREE.MeshStandardMaterial({color:0x6b5a4a}));b1.position.set(0,0.3,-5);scene.add(b1);
 let b2=new THREE.Mesh(new THREE.BoxGeometry(12,0.4,3),new THREE.MeshStandardMaterial({color:0x6b5a4a}));b2.position.set(0,0.3,-18);scene.add(b2);

 // bomen pixel style - zoals foto
 for(let i=0;i<40;i++){
   let tree=new THREE.Group();
   let trunk=new THREE.Mesh(new THREE.CylinderGeometry(0.1,0.15,0.8,5),new THREE.MeshStandardMaterial({color:0x3a2a1a}));trunk.position.y=0.4;tree.add(trunk);
   let top=new THREE.Mesh(new THREE.ConeGeometry(0.8,1.8,6),new THREE.MeshStandardMaterial({color:0x2a4a7a}));top.position.y=1.6;tree.add(top);
   let side=Math.random()>0.5?1:-1; let x=(15+Math.random()*40)*side; let z=(Math.random()-0.5)*100;
   tree.position.set(x,0,z); scene.add(tree);
 }

 // dorp indeling zoals foto
 let spots=[[-18,12],[-22,5],[-20,-2],[-12,-8],[-25,-15],[18,10],[22,3],[20,-3],[15,-10],[24,-14],[0,-28],[-8,-30]];
 spots.forEach(p=>pixelCabin(p[0],p[1]));

 // SMAUG - gouden
 let gold=new THREE.MeshStandardMaterial({color:0xffcc33,metalness:0.6,roughness:0.4});
 dragon=new THREE.Group();
 let body=new THREE.Mesh(new THREE.CapsuleGeometry(0.7,2.5,4,8),gold);body.rotation.z=1.57;dragon.add(body);
 let head=new THREE.Group();head.position.set(2,0.3,0);
 let skull=new THREE.Mesh(new THREE.BoxGeometry(0.8,0.5,0.5),gold);head.add(skull);
 let snout=new THREE.Mesh(new THREE.BoxGeometry(0.6,0.3,0.35),gold);snout.position.x=0.6;head.add(snout);
 dragon.add(head);
 function wing(s){let g=new THREE.Group();let sh=new THREE.Shape();sh.moveTo(0,0);sh.lineTo(5,1);sh.lineTo(5.5,0);sh.lineTo(5,-1.2);sh.lineTo(0,0);let m=new THREE.Mesh(new THREE.ShapeGeometry(sh),new THREE.MeshStandardMaterial({color:0xffaa22,side:THREE.DoubleSide}));g.add(m);g.position.set(0,0.4,s*0.8);return g;}
 leftWing=wing(1);rightWing=wing(-1);dragon.add(leftWing);dragon.add(rightWing);
 dragon.position.set(0,10,25);scene.add(dragon);

 let joyEl=document.getElementById('joy'),stick=document.getElementById('stick');
 joyEl.addEventListener('touchmove',e=>{let r=joyEl.getBoundingClientRect();let t=e.touches[0];let x=t.clientX-r.left-55,y=t.clientY-r.top-55;let d=Math.hypot(x,y);if(d>40){x=x/d*40;y=y/d*40;}stick.style.transform=⁠ translate(${x}px,${y}px) ⁠;joy.x=x/40;joy.y=y/40;e.preventDefault()},{passive:false});
 joyEl.addEventListener('touchend',()=>{stick.style.transform='translate(0,0)';joy.x=0;joy.y=0;});
 let fb=document.getElementById('fire');fb.addEventListener('touchstart',e=>{isFiring=true;e.preventDefault()});fb.addEventListener('touchend',()=>isFiring=false);
 animate();
}

function animate(){
 requestAnimationFrame(animate);
 dragon.position.x+=joy.x*0.5;dragon.position.z+=joy.y*0.5;
 dragon.position.x=Math.max(-30,Math.min(30,dragon.position.x));
 dragon.position.z=Math.max(-35,Math.min(35,dragon.position.z));
 dragon.position.y=10+Math.sin(Date.now()*0.002)*0.3;
 dragon.rotation.y=-joy.x*0.6;
 let flap=Math.sin(Date.now()*0.012)*0.7;leftWing.rotation.z=flap;rightWing.rotation.z=-flap;
 // CHASE CAM ACHTER SMAUG
 let behind=new THREE.Vector3(-9,4,0);behind.applyQuaternion(dragon.quaternion);
 let camPos=dragon.position.clone().add(behind);
 camera.position.lerp(camPos,0.1);
 camTarget.lerp(dragon.position,0.15);
 camera.lookAt(camTarget);

 if(isFiring&&Math.random()<0.6){
   let b=new THREE.Mesh(new THREE.SphereGeometry(0.35),new THREE.MeshStandardMaterial({color:0xff5500,emissive:0xff2200,emissiveIntensity:2}));
   b.position.copy(dragon.position);b.position.x+=2;
   b.userData={v:new THREE.Vector3(0.3,-0.1,0)};scene.add(b);fires.push(b);
 }
 fires=fires.filter(b=>{b.position.add(b.userData.v);b.userData.v.y-=0.02;b.scale.multiplyScalar(0.98);
  houses.forEach(h=>{if(!h.userData.burning&&b.position.distanceTo(h.position)<2.5){h.userData.burning=true;
   h.children[0].material.color.set(0x330000);
   // vuur effect
   let fireMesh=new THREE.Mesh(new THREE.BoxGeometry(1,1.5,1),new THREE.MeshStandardMaterial({color:0xff4400,emissive:0xff2200,emissiveIntensity:1.5}));fireMesh.position.y=1.5;h.add(fireMesh);
   score++;scorePts+=250;document.getElementById('s').textContent=score;document.getElementById('sc').textContent=scorePts;
  }});
  if(b.position.y<0||b.scale.x<0.1){scene.remove(b);return false;}return true;});
 renderer.render(scene,camera);
}
</script></body></html>
