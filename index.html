<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>SMAUG PIXEL CHASE - FIXED</title>
<style>
body{margin:0;background:#0a1430;overflow:hidden;touch-action:none;font-family:monospace}
canvas{display:block;width:100vw;height:100vh;image-rendering:pixelated}
#joy{position:absolute;left:15px;bottom:20px;width:110px;height:110px;background:rgba(255,255,255,.15);border-radius:50%;border:2px solid rgba(255,255,255,.3);z-index:10}
#stick{position:absolute;left:25px;top:25px;width:60px;height:60px;background:rgba(255,255,255,.7);border-radius:50%;pointer-events:none}
#fire{position:absolute;right:15px;bottom:20px;width:95px;height:95px;background:radial-gradient(#ff7700,#aa2200);border-radius:50%;border:3px solid #ffaa00;color:#fff;font-weight:bold;font-size:16px;z-index:10}
#ui{position:absolute;top:0;left:0;right:0;background:rgba(0,0,60,.9);color:#ffdd77;padding:8px 12px;font-weight:bold;font-size:13px;display:flex;justify-content:space-between;z-index:10}
</style>
</head><body>
<div id="ui"><span>BURNED: <b id="s">0</b></span><span>SCORE: <b id="sc">0</b></span><span style="color:#aaf">PIXEL CHASE</span></div>
<canvas id="c"></canvas>
<div id="joy"><div id="stick"></div></div>
<button id="fire">FIRE</button>
<script>
let canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
function resize(){canvas.width=window.innerWidth;canvas.height=window.innerHeight;}
resize();window.addEventListener('resize',resize);
let joy={x:0,y:0},isFiring=false,dragon={x:0,y:0},houses=[],fires=[],score=0,particles=[];
let W=()=>canvas.width,H=()=>canvas.height;
function init(){
 dragon={x:W()/2,y:H()-120};
 houses=[];for(let i=0;i<14;i++){let rx=150+Math.random()*(W()-300);let ry=100+Math.random()*(H()-250);if(Math.abs(rx-W()/2)<60)rx+=120;houses.push({x:rx,y:ry,burning:false,burnT:0});}
}
init();
let joyEl=document.getElementById('joy'),stick=document.getElementById('stick');
function handle(e){let r=joyEl.getBoundingClientRect();let t=e.touches?e.touches[0]:e;if(!t)return;let x=t.clientX-r.left-55,y=t.clientY-r.top-55;let d=Math.hypot(x,y);if(d>40){x=x/d*40;y=y/d*40;}stick.style.transform=`translate(${x}px,${y}px)`;joy.x=x/40;joy.y=y/40;}
joyEl.addEventListener('touchmove',e=>{handle(e);e.preventDefault();},{passive:false});
joyEl.addEventListener('touchstart',e=>{handle(e);},{passive:false});
joyEl.addEventListener('touchend',()=>{stick.style.transform='translate(0,0)';joy.x=0;joy.y=0;});
joyEl.addEventListener('mousedown',e=>{handle(e);});
window.addEventListener('mousemove',e=>{if(e.buttons)handle(e);});
window.addEventListener('mouseup',()=>{stick.style.transform='translate(0,0)';joy.x=0;joy.y=0;});
let fireBtn=document.getElementById('fire');
fireBtn.addEventListener('touchstart',e=>{isFiring=true;e.preventDefault();},{passive:false});
fireBtn.addEventListener('touchend',()=>isFiring=false);
fireBtn.addEventListener('mousedown',()=>isFiring=true);
window.addEventListener('mouseup',()=>isFiring=false);
window.addEventListener('keydown',e=>{if(e.code==='Space')isFiring=true;});
window.addEventListener('keyup',e=>{isFiring=false;joy.x=0;joy.y=0;});
function draw(){
 let w=W(),h=H();
 ctx.fillStyle='#16213e';ctx.fillRect(0,0,w,h);
 ctx.fillStyle='#c8d8f0';ctx.fillRect(0,0,w*0.38,h);ctx.fillRect(w*0.62,0,w*0.38,h);
 ctx.fillStyle='#2a5a9a';ctx.fillRect(w*0.38,0,w*0.24,h);
 ctx.fillStyle='#7bb0e0';ctx.fillRect(w*0.42,0,w*0.16,h);
 ctx.fillStyle='#6b5a4a';ctx.fillRect(w*0.35, h*0.35, w*0.3, 14);ctx.fillRect(w*0.35, h*0.65, w*0.3, 14);
 ctx.fillStyle='#1e3a5a';for(let i=0;i<20;i++){let x=(i%2?20:w-40)+Math.random()*10,y=30+i*(h/20);ctx.fillRect(x,y,12,12);}
 houses.forEach(h=>{
  if(h.burning){
   h.burnT++;let flick=0.5+Math.sin(h.burnT*0.3)*0.5;
   ctx.fillStyle=`hsl(${15+flick*10},100%,${50+flick*20}%)`;ctx.fillRect(h.x-4,h.y-8,32,32);
   ctx.fillStyle='rgba(80,80,80,0.5)';ctx.fillRect(h.x+10,h.y-25-Math.random()*15,4,10);
  }else{ctx.fillStyle='#6b4a2f';ctx.fillRect(h.x,h.y,26,22);ctx.fillStyle='#4a3725';ctx.fillRect(h.x-3,h.y-8,32,10);ctx.fillStyle='#ddeeff';ctx.fillRect(h.x-3,h.y-9,32,3);ctx.fillStyle='#ff6600';ctx.fillRect(h.x+18,h.y+6,4,4);}
 });
 fires.forEach(f=>{ctx.fillStyle='#ff5500';ctx.beginPath();ctx.arc(f.x,f.y,6,0,6.28);ctx.fill();ctx.fillStyle='#ffaa00';ctx.beginPath();ctx.arc(f.x,f.y,3,0,6.28);ctx.fill();});
 ctx.save();ctx.translate(dragon.x,dragon.y);
 ctx.fillStyle='#ffcc33';ctx.fillRect(-20,-12,40,22);ctx.fillRect(-7,-28,14,18);ctx.fillRect(-9,-36,18,12);
 ctx.fillStyle='#ffaa22';ctx.fillRect(-50,-10,24,14);ctx.fillRect(26,-10,24,14);
 ctx.fillStyle='#ff0000';ctx.fillRect(-6,-33,3,3);ctx.fillRect(4,-33,3,3);
 if(isFiring){ctx.fillStyle='#ff5500';ctx.fillRect(-5,-48,10,16);ctx.fillStyle='#ffff00';ctx.fillRect(-2,-58,4,14);}
 ctx.restore();
 particles.forEach(p=>{ctx.fillStyle=`rgba(255,${100+p.a},0,${p.a/100})`;ctx.fillRect(p.x,p.y,3,3);});
}
function update(){
 dragon.x+=joy.x*6;dragon.y+=joy.y*6;
 dragon.x=Math.max(30,Math.min(W()-30,dragon.x));dragon.y=Math.max(H()*0.5,Math.min(H()-30,dragon.y));
 if(isFiring&&Math.random()<0.35){fires.push({x:dragon.x,y:dragon.y-40,vy:-9});}
 fires=fires.filter(f=>{
  f.y+=f.vy;
  let hit=false;
  houses.forEach(h=>{
   if(!h.burning&&Math.hypot(f.x-(h.x+13),f.y-(h.y+11))<28){h.burning=true;score++;document.getElementById('s').textContent=score;document.getElementById('sc').textContent=score*250;hit=true;for(let i=0;i<8;i++)particles.push({x:h.x+13,y:h.y+11,vx:(Math.random()-0.5)*4,vy:(Math.random()-0.5
